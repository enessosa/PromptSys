<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>PromptSys Settings</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <h1>Claude API key</h1>
  <p id="status" class="muted">Loading…</p>
  <form id="form">
    <label for="key">Anthropic API key</label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
    <div class="row">
      <button id="save" class="primary" type="submit">Save and restart backend</button>
      <button id="remove" type="button" hidden>Remove key</button>
    </div>
  </form>
  <p id="message" role="status"></p>
  <p class="muted">The key is kept encrypted by your system keychain and is never shown again. Chat and ablation need it.</p>
  <script src="settings.js"></script>
</body>
</html>
