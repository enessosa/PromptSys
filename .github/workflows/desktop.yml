name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: [main]
    paths: ['desktop/**', 'backend/**', 'frontend/**', '.github/workflows/desktop.yml']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install backend and frontend
        shell: bash
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Install desktop
        working-directory: desktop
        run: npm ci
      - name: Check desktop
        working-directory: desktop
        run: |
          npm run typecheck
          npm run lint
          npm test
      # Builds backend and frontend, stages the production backend for this OS, runs electron-builder.
      # Unsigned: no code signing, no auto-update (decided).
      - name: Build installers
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: promptsys-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  # A tag "desktop-vX.Y.Z" publishes the installers of all three systems as a GitHub release (downloads on the Releases page).
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --title "PromptSys ${TAG#desktop-v}" --generate-notes
